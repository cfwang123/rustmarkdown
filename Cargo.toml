[package]
name = "rustmarkdown"
version = "1.0.1"
edition = "2021"
description = "Native Markdown preview and editor"
license = "MIT"

[dependencies]
eframe = "0.33"
egui = "0.33"
rfd = "0.15"
regex = "1"
syntect = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
ureq = "2"
opener = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
two-face = "0.4"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = "0.48.1"
arboard = "3.6.1"
office_oxide = "0.1.8"
libloading = "0.8"
encoding_rs = "0.8"
chardetng = "0.1"
notify = "6.1.1"

[build-dependencies]
winresource = "0.1"

[target."cfg(windows)".dependencies]
clipboard-win = { version = "5.4.1", features = ["std"] }
