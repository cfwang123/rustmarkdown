[package]
name = "rustmarkdown"
version = "1.0.2"
edition = "2021"
description = "Native Markdown preview and editor"
license = "MIT"

[dependencies]
# 关掉 accesskit：Windows 无障碍接口会在窗口出现数秒后要整棵树，
# egui 给源码每一行建节点，两千行文档会卡约 1 秒。
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.33"
rfd = "0.15"
regex = "1"
syntect = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
ureq = "2"
opener = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
two-face = "0.4"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = "0.48.1"
arboard = "3.6.1"
office_oxide = "0.1.8"
calamine = "0.26"
libloading = "0.8"
encoding_rs = "0.8"
chardetng = "0.1"
notify = "6.1.1"
blowfish = "0.10"
sha2 = "0.10"
cipher = { version = "0.5", features = ["block-padding"] }

[build-dependencies]
winresource = "0.1"

[target."cfg(windows)".dependencies]
clipboard-win = { version = "5.4.1", features = ["std"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
